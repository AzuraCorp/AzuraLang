name: Publish Python Distribution to PyPI

on:
  release:
    types: [published] # Triggers only when a GitHub release is officially published

jobs:
  build-and-publish:
    name: Build and publish Python distribution
    runs-on: arch-latest
    
    # Binds this job to the GitHub environment rules you configured
    environment:
      name: pypi
      url: https://pypi.org/p/AzuraLang # Optional: replace with your package URL

    # Permissions required to fetch the secure OIDC identity token from GitHub
    permissions:
      id-token: write      # Crucial: allows PyPI to trust this specific workflow run
      contents: read       # Allows the runner to pull your repository code

    steps:
      # Step 1: Download your source code into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up a secure Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Step 3: Install the standard PyPA building tool
      - name: Install build tools
        run: python -m pip install build --user

      # Step 4: Compile the package into a source tarball (.tar.gz) and a wheel (.whl)
      - name: Build a binary wheel and a source tarball
        run: python -m build

      # Step 5: Securely upload to PyPI via Trusted Publishing
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
