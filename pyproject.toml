[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
[project]
name = "AzuraLang"
version = "0.1"
ALversion = "BETA-1"
authors = [
  { name="Zhan2os1ks", email="azuracorp@duck.com" },
]
description = "A Python framework for easier making of GUI apps."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "LGPL-3.0-only"
license-files = ["LICEN[CS]E*"]

[project.urls]
Issues = "https://github.com/AzuraCorp/AzuraLang/issues"
Wiki = "https://github.com/AzuraCorp/AzuraLang/wiki"
